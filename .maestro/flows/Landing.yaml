# flow: Complete local-game smoke test
# intent: Start, play, roll dice, finish, land on the rematch, and inspect the finished game without an account.

appId: ${MAESTRO_APP_ID}
tags: [smoke, local]
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible:
    id: "player-grid"
- longPressOn:
    id: "life-seat-1--1"
- tapOn:
    id: "life-editor-step-1--5"
- tapOn:
    id: "life-editor-close-seat-1"
- assertVisible: "Seat 1, Player 1, 15 life"
- tapOn:
    id: "game-menu-button"
- tapOn:
    id: "dice-button"
- tapOn:
    id: "dice-d20-roll"
- tapOn: "Close"
- assertVisible: "Seat 1, Player 1, 15 life"
- tapOn:
    id: "game-menu-button"
- tapOn:
    id: "end-game-button"
- assertVisible: "Who won?"
- tapOn:
    id: "end-game-winner-0"
- tapOn:
    id: "confirm-end-game-button"
- assertVisible:
    id: "game-saved-toast"
- assertVisible: "Seat 1, Player 1, 20 life"
- tapOn:
    id: "game-saved-summary-button"
- assertVisible: "Finished"
- assertVisible: "Result"
