# flow: Recover an interrupted local game
# intent: Restore the active local game after the app restarts.

appId: ${MAESTRO_APP_ID}
tags: [local]
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible:
    id: "player-grid"
- tapOn:
    id: "game-menu-button"
- tapOn:
    id: "setup-button"
- assertVisible: "New game"
- repeat:
    times: 4
    commands:
      - tapOn:
          id: "player-count-increment"
- assertVisible: "Players, 6"
- tapOn:
    id: "start-game-button"
- assertVisible:
    id: "life-seat-6-1"
- tapOn:
    id: "life-seat-1-1"
- assertVisible: "Seat 1, Player 1, 21 life"
- stopApp
- launchApp
- assertVisible:
    id: "player-grid"
- assertVisible:
    id: "life-seat-6-1"
- assertVisible: "Seat 1, Player 1, 21 life"
