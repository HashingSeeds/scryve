# flow: Keep local play available without cloud configuration
# intent: Explain the missing configuration while preserving the local-game path.

appId: ${MAESTRO_APP_ID}
# precondition: a build compiled WITHOUT cloud env (no Clerk/Convex EXPO_PUBLIC vars);
# a configured build shows the auth gate instead, so default runs exclude this tag.
tags: [unconfigured]
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible:
    id: "player-grid"
- tapOn:
    id: "game-menu-button"
- tapOn:
    id: "connect-button"
- assertVisible: ".*Connected play needs valid public configuration:.*Local play remains available.*"
- tapOn: "Back"
- assertVisible:
    id: "player-grid"
- tapOn:
    id: "life-seat-1-1"
- assertVisible: "Seat 1, Player 1, 21 life"
