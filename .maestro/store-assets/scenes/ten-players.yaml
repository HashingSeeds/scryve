# A ten seat Commander table mid-game.
appId: ${APP_ID}
---
- runFlow:
    file: _Start.yaml
    env: {GAME: commander, TURNS: life}
- tapOn: {id: game-menu-button}
- tapOn: {id: setup-button}
- tapOn: {id: player-count-more}
- tapOn: {id: player-count-10}
- tapOn: {id: start-game-button}
- extendedWaitUntil:
    visible: {id: life-card-seat-10}
    timeout: 15000
- runFlow: {file: _Life.yaml, env: {SEAT: 1, STEP: -5, TIMES: 2}}
- runFlow: {file: _Life.yaml, env: {SEAT: 3, STEP: -5, TIMES: 3}}
- runFlow: {file: _Life.yaml, env: {SEAT: 6, STEP: 1, TIMES: 2}}
- runFlow: {file: _Life.yaml, env: {SEAT: 7, STEP: -1, TIMES: 9}}
- runFlow: {file: _Life.yaml, env: {SEAT: 9, STEP: -5, TIMES: 1}}
- waitForAnimationToEnd
- takeScreenshot: ten-players
