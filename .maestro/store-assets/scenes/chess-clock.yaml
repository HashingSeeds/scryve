# Commander on the chess clock, a few turns in.
appId: ${APP_ID}
---
- runFlow:
    file: _Start.yaml
    env: {GAME: commander, TURNS: chess}
- tapOn: {id: dice-chip-2-claim}
- tapOn: {id: turn-chip-2}
- runFlow: {file: _Life.yaml, env: {SEAT: 3, STEP: -5, TIMES: 1}}
- tapOn: {id: turn-chip-pass-2}
- runFlow: {file: _Life.yaml, env: {SEAT: 1, STEP: -1, TIMES: 3}}
- tapOn: {id: turn-chip-pass-4}
- runFlow: {file: _Life.yaml, env: {SEAT: 2, STEP: -5, TIMES: 2}}
- waitForAnimationToEnd
- takeScreenshot: chess-clock
