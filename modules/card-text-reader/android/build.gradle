plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cardtextreader'
version = '0.1.0'

android {
  namespace "expo.modules.cardtextreader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
