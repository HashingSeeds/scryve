plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playappupdate'
version = '0.1.0'

android {
  namespace "expo.modules.playappupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.google.android.play:app-update:2.1.0'
}
