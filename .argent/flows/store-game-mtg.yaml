steps:
  - echo: Five seat Commander on the default bottom focus layout, the front board of the multi-game tile
  - echo: The connected scene leaves a game in play; finish it as a win before the reset below abandons it
  - script: { path: scripts/table-reset.mjs, timeout: 60000 }
  - launch: com.sowinghope.count.preview
  - run: store-reset-local
  - tap: { id: game-menu-button }
  - tap: { id: setup-button }
  - await: { visible: { id: game-tab-mtg } }
  - tap: { id: game-tab-mtg }
  - tap: { id: game-type-commander }
  - echo: Seat count carries over between games; clamp to 2, then step up to 5
  - tap: { id: setup-change-button }
  - await: { visible: { id: player-count-decrement } }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-increment }
  - tap: { id: player-count-increment }
  - tap: { id: player-count-increment }
  - tap: { id: setup-options-done }
  - await: { idle: true }
  - tap: { id: start-game-button }
  - await: { visible: { id: player-grid } }
  - await: { idle: true }
  - echo: Spread the life totals so the table reads mid-game
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-1--1 }
  - tap: { id: life-seat-2--1 }
  - tap: { id: life-seat-2--1 }
  - tap: { id: life-seat-2--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-3--1 }
  - tap: { id: life-seat-4--1 }
  - tap: { id: life-seat-4--1 }
  - tap: { id: life-seat-4--1 }
  - tap: { id: life-seat-4--1 }
  - tap: { id: life-seat-4--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - wait: 2000
  - await: { idle: true }
