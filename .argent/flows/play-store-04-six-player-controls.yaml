# Google Play controls capture. Reinstalls the local preview build for a fresh game.
steps:
  - launch: com.sowinghope.count.preview
  - tool: reinstall-app
    args:
      bundleId: com.sowinghope.count.preview
      appPath: android/app/build/outputs/apk/release/app-release.apk
  - launch: com.sowinghope.count.preview
  - await: { visible: { id: accept-legal-button } }
  - tap: { id: accept-legal-button }
  - await: { visible: { id: player-grid } }
  - await: { idle: true }
  - tap: { id: game-menu-button }
  - await: { idle: true }
  - tap: { id: setup-button }
  - await: { visible: { text: New game } }
  - tap: { id: player-count-increment }
  - tap: { id: player-count-increment }
  - tap: { id: player-count-increment }
  - tap: { id: player-count-increment }
  - await: { idle: true }
  - tap: { id: start-game-button }
  - await: { visible: { id: player-grid } }
  - await: { idle: true }
  - echo: Nudge two seats off the starting total so the board is not all equal.
  - tap: { id: life-seat-1-1 }
  - tap: { id: life-seat-2--1 }
  - await: { idle: true }
  - tap: { id: game-menu-button }
  - await: { idle: true }
