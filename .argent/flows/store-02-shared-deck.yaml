steps:
  - echo: A friend's deck opened from its share link; goldie/seed.cjs shares it from mara and writes the link fragment
  - echo: The connected scene leaves a game in play; finish it as a win so History shows a result, not "Abandoned"
  - script: { path: scripts/table-reset.mjs, timeout: 60000 }
  - launch: com.sowinghope.count.preview
  - run: store-reset-local
  - run: store-shared-deck-link
  - wait: 2500
  - echo: >-
      iOS asks "Open in Scryve (Preview)?" the first time a simulator opens the link, and remembers
      the answer. Flows can't tap system UI, so accept it once by hand along with the one-time
      sign-in (see goldie/goldie.config.ts).
  - echo: >-
      On the iPhone Duo the link loses argent's native devtools connection, so no step after it
      can read the UI tree; a fixed wait lets the deck load from the preview before capture.
  - wait: 6000
