  - tap: { id: life-seat-4--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
  - tap: { id: life-seat-5--1 }
