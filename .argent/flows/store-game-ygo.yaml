steps:
  - echo: A two seat Yu-Gi-Oh! board for the multi-game tile
  - launch: com.sowinghope.count.preview
  - run: store-reset-local
  - tap: { id: game-menu-button }
  - tap: { id: setup-button }
  - await: { visible: { id: game-tab-ygo } }
  - tap: { id: game-tab-ygo }
  - tap: { id: game-type-ygo-advanced }
  - echo: Seat count carries over between games; pin it to 2 (the stepper clamps at 2 and 6)
  - tap: { id: setup-change-button }
  - await: { visible: { id: player-count-decrement } }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-decrement }
  - tap: { id: player-count-decrement }
  - tap: { id: setup-options-done }
  - await: { idle: true }
  - echo: Purple and teal so the side boards don't repeat the default orange and blue
  - scroll-to: { target: { id: player-appearance-1 } }
  - tap: { id: player-appearance-1 }
  - await: { visible: { id: appearance-color-77558a } }
  - tap: { id: appearance-color-77558a }
  - tap: { id: save-local-appearance-button }
  - await: { idle: true }
  - scroll-to: { target: { id: player-appearance-2 } }
  - tap: { id: player-appearance-2 }
  - await: { visible: { id: appearance-color-117b9c } }
  - tap: { id: appearance-color-117b9c }
  - tap: { id: save-local-appearance-button }
  - await: { idle: true }
  - tap: { id: start-game-button }
  - await: { visible: { id: player-grid } }
  - await: { idle: true }
  - tap: { id: dice-chip-2-claim }
  - tap: { id: life-seat-1--1000 }
  - tap: { id: life-seat-1--1000 }
  - tap: { id: life-seat-2--1000 }
  - tap: { id: life-seat-2--1000 }
  - tap: { id: life-seat-2--1000 }
  - wait: 1500
  - await: { idle: true }
