name: sync offline cards

on:
  schedule:
    - cron: "53 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the card files without uploading them
        required: true
        default: false
        type: boolean

concurrency:
  group: sync-local-cards-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ygo-image-mirror-production
    strategy:
      fail-fast: false
      matrix:
        game: [fab]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync offline cards
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GAME: ${{ matrix.game }}
          YGO_MIRROR_BASE_URL: https://ygo-images.scryve.sow.care
          YGO_MIRROR_TOKEN: ${{ secrets.YGO_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          args=("$GAME")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          pnpm sync:local-cards -- "${args[@]}"
