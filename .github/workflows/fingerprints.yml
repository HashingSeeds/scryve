name: native fingerprints

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.json"
      - "app.config.ts"
      - "eas.json"
      - "patches/**"
      - "assets/**"
      # verified against `eas fingerprint:generate` raw sources: package.json +
      # pnpm-lock.yaml (node_modules contents), expoConfig (app.json +
      # app.config.ts), eas.json, assets, and patches. babel/metro/nvmrc do not
      # contribute to the native fingerprint.

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: native-fingerprints-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      ${{ github.event.pull_request.head.repo.fork == false &&
      github.actor == github.event.pull_request.user.login &&
      (github.actor == 'mchisolm0' ||
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cached base fingerprints
        uses: actions/cache@v4
        with:
          path: base-fingerprints
          key: base-fingerprints-${{ github.event.pull_request.base.sha }}

      - name: Check base fingerprint cache
        id: base_state
        run: |
          count=$(find base-fingerprints -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "need_base=$([ "$count" -eq 6 ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"

      - name: Prepare base revision
        if: steps.base_state.outputs.need_base == 'yes'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$RUNNER_TEMP/base"
          mkdir -p "$base_dir"
          git fetch --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          pnpm --dir "$base_dir" install --frozen-lockfile

      - name: Check native fingerprints
        id: fingerprints
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- native-fingerprint-check -->'
          comment_file="$RUNNER_TEMP/native-fingerprints.md"
          changed_inputs_file="$RUNNER_TEMP/native-fingerprint-inputs.txt"
          needs_build=false
          : > "$changed_inputs_file"

          {
            echo "$marker"
            echo 'Native builds are needed for these targets:'
            echo
            echo '| Environment | Platform | Fingerprint difference |'
            echo '| --- | --- | --- |'
          } > "$comment_file"

          for profile in development:device preview:device production; do
            case "$profile" in
              development:device) environment=Development ;;
              preview:device) environment=Preview ;;
              production) environment=Production ;;
            esac

            for platform in ios android; do
              fingerprint_file="$RUNNER_TEMP/fingerprint-${profile//:/-}-$platform.json"
              base_fingerprint_file="$RUNNER_TEMP/base-fingerprint-${profile//:/-}-$platform.json"
              matching_file="$RUNNER_TEMP/matching-${profile//:/-}-$platform.json"
              latest_file="$RUNNER_TEMP/latest-${profile//:/-}-$platform.json"

              pnpm exec eas fingerprint:generate \
                --build-profile "$profile" \
                --platform "$platform" \
                --json \
                --non-interactive > "$fingerprint_file"
              current_hash=$(jq -er '.hash' "$fingerprint_file")

              cached_base_fingerprint_file="base-fingerprints/${profile//:/-}-$platform.json"
              if [ -f "$cached_base_fingerprint_file" ]; then
                cp "$cached_base_fingerprint_file" "$base_fingerprint_file"
              else
                (
                  cd "$RUNNER_TEMP/base"
                  pnpm exec eas fingerprint:generate \
                    --build-profile "$profile" \
                    --platform "$platform" \
                    --json \
                    --non-interactive
                ) > "$base_fingerprint_file"
                mkdir -p "$(dirname "$cached_base_fingerprint_file")"
                cp "$base_fingerprint_file" "$cached_base_fingerprint_file"
              fi
              base_hash=$(jq -er '.hash' "$base_fingerprint_file")

              if [ "$current_hash" = "$base_hash" ]; then
                continue
              fi

              pnpm exec eas build:list \
                --build-profile "$profile" \
                --platform "$platform" \
                --status finished \
                --fingerprint-hash "$current_hash" \
                --limit 1 \
                --json \
                --non-interactive > "$matching_file"

              if [ "$(jq 'length' "$matching_file")" -gt 0 ]; then
                continue
              fi

              needs_build=true
              jq -nr \
                --slurpfile base "$base_fingerprint_file" \
                --slurpfile current "$fingerprint_file" '
                  def key:
                    if .type == "contents" then "contents:\(.id)"
                    else "\(.type):\(.filePath)"
                    end;
                  ($base[0].sources | map({ key: key, value: . }) | from_entries) as $base_sources |
                  ($current[0].sources | map({ key: key, value: . }) | from_entries) as $current_sources |
                  (($base_sources | keys) + ($current_sources | keys) | unique)[] as $key |
                  select(($base_sources[$key].hash // null) != ($current_sources[$key].hash // null)) |
                  ($current_sources[$key] // $base_sources[$key]) |
                  (.filePath // .id)
                ' >> "$changed_inputs_file"

              pnpm exec eas build:list \
                --build-profile "$profile" \
                --platform "$platform" \
                --status finished \
                --limit 1 \
                --json \
                --non-interactive > "$latest_file"

              current_short=${current_hash:0:8}
              if [ "$(jq 'length' "$latest_file")" -eq 0 ]; then
                difference="No finished build → \`$current_short\`"
              else
                previous_hash=$(jq -er '.[0].fingerprint.hash' "$latest_file")
                previous_short=${previous_hash:0:8}
                build_id=$(jq -er '.[0].id' "$latest_file")
                account=$(jq -er '.[0].app.ownerAccount.name' "$latest_file")
                project=$(jq -er '.[0].app.slug' "$latest_file")
                build_url="https://expo.dev/accounts/$account/projects/$project/builds/$build_id"
                difference="[\`$previous_short\`]($build_url) → \`$current_short\`"
              fi

              case "$platform" in
                ios) platform_name=iOS ;;
                android) platform_name=Android ;;
              esac
              echo "| $environment | $platform_name | $difference |" >> "$comment_file"
            done
          done

          if [ "$needs_build" = true ]; then
            {
              echo
              echo 'Changed fingerprint inputs:'
              sort -u "$changed_inputs_file" | while IFS= read -r input; do
                echo "- \`$input\`"
              done
            } >> "$comment_file"
          fi

          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
          echo "comment_file=$comment_file" >> "$GITHUB_OUTPUT"

      - name: Update pull request comment
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: ${{ steps.fingerprints.outputs.comment_file }}
          NEEDS_BUILD: ${{ steps.fingerprints.outputs.needs_build }}
        with:
          script: |
            const fs = require("node:fs")
            const marker = "<!-- native-fingerprint-check -->"
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (process.env.NEEDS_BUILD === "true") {
              const body = fs.readFileSync(process.env.COMMENT_FILE, "utf8")
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
            } else if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              })
            }
