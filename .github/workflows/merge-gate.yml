name: merge gate

# Keeps one sticky comment listing every gate an agent's land skill checks before merging.
# `node scripts/merge-gate.cjs <pr>` prints the same summary locally. Every trigger runs
# main's copy of the script, which reads the pull request through the API and never runs
# pull request code, so pull_request_target is safe here. Actions has no event for resolving
# a review thread, so resolved threads show on the next push, review, or check run.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [checks, native fingerprints]
    types: [completed]

permissions: {}

jobs:
  find:
    # Review events on fork PRs get a read-only token, so those refresh on the other triggers.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      # workflow_run lists no pull requests for forks, so look the head commit up instead.
      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$NUMBER" ]; then
            NUMBER=$(gh pr list --state open --search "$HEAD_SHA" --json number --jq '.[0].number // empty')
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

  # One group per pull request, so the newest event wins. The script also skips the write
  # when the head moved while it ran.
  comment:
    needs: find
    if: needs.find.outputs.number != ''
    concurrency:
      group: merge-gate-${{ needs.find.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update merge gate comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ needs.find.outputs.number }}
        run: node scripts/merge-gate.cjs "$NUMBER" --comment
