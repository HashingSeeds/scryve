name: feedback link

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: feedback-link-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  link:
    # why: the repo is public, and only issues we file may reach the production deploy key.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      && (github.event.action == 'opened' || github.event.changes.body)
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the feedback this issue cites
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: node scripts/feedback-link.cjs
