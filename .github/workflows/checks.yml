name: checks

on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ygo: ${{ steps.filter.outputs.ygo }}
      exportable: ${{ steps.filter.outputs.exportable }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ygo:
              - 'workers/ygo-image-mirror/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            exportable:
              - 'src/**'
              - 'app.config.ts'
              - 'app.json'
              - 'assets/**'
              - 'web/**'
              - 'patches/**'
              - 'babel.config.js'
              - 'metro.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'

  ygo-image-mirror:
    needs: changes
    if: needs.changes.outputs.ygo == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Yu-Gi-Oh image mirror
        run: pnpm check:ygo-worker

  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint
        run: pnpm lint:check

      - name: Type-check app and tests
        run: pnpm compile

      - name: Validate dependency boundaries
        run: pnpm deps:check

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run Jest tests
        id: jest
        run: CI=1 pnpm exec jest --ci --silent

      - name: Add Jest result to job summary
        if: always()
        run: |
          echo "Jest result: ${{ steps.jest.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  export:
    needs: changes
    if: needs.changes.outputs.exportable == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export production-like JS bundles
        run: CI=1 pnpm export:check
