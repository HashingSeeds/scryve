name: checks

on:
  pull_request:
  # Pull requests can only restore caches saved by their own runs or by main. Running on
  # main whenever a cache key input changes gives each new pull request a warm first run.
  # Keep this list in sync with the hashFiles() inputs of the cache keys below.
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - ".eslintrc.js"
      - ".eslint-comments-baseline.json"
      - ".prettierrc"
      - "tools/eslint-plugin-self-explanatory-code/**"
      - "babel.config.js"
      - "metro.config.js"
      - "app.json"
      - "app.config.ts"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ygo: ${{ steps.filter.outputs.ygo }}
      exportable: ${{ steps.filter.outputs.exportable }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ygo:
              - 'workers/ygo-image-mirror/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            exportable:
              - 'src/**'
              - 'app.config.ts'
              - 'app.json'
              - 'assets/**'
              - 'web/**'
              - 'patches/**'
              - 'babel.config.js'
              - 'metro.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'

  ygo-image-mirror:
    needs: changes
    if: needs.changes.outputs.ygo == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Yu-Gi-Oh image mirror
        run: pnpm check:ygo-worker

  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint does not notice changes to plugin code or to the comment baseline the
      # self-explanatory-code rule reads, so those files are part of the key.
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', '.eslintrc.js', '.eslint-comments-baseline.json', '.prettierrc', 'tools/eslint-plugin-self-explanatory-code/**') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml', '.eslintrc.js', '.eslint-comments-baseline.json', '.prettierrc', 'tools/eslint-plugin-self-explanatory-code/**') }}-

      - name: Check lint
        run: pnpm lint:check

      # tsc's build info tracks file hashes and compiler options itself, so any older entry is safe.
      - name: Restore TypeScript build info
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ github.sha }}
          restore-keys: tsc-

      - name: Type-check app and tests
        run: pnpm compile

      - name: Validate dependency boundaries
        run: pnpm deps:check

      - name: Build marketing site
        run: pnpm site:build

      - name: Run script tests
        run: pnpm test:scripts

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run Jest tests
        id: jest
        run: CI=1 pnpm exec jest --ci --silent

      - name: Add Jest result to job summary
        if: always()
        run: |
          echo "Jest result: ${{ steps.jest.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  export:
    needs: changes
    # Pushes to main skip the changes job and always export, to seed the Metro cache.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.exportable == 'true') }}
    # Free on this public repo and only about 15s slower than Blacksmith for this job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # An exact key with no fallback keeps the cache from growing. Metro stores
      # transformed modules by content hash, so source files changed since the save are
      # simply transformed again.
      - name: Restore Metro cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js', 'app.json', 'app.config.ts') }}

      # Metro writes its cache to $TMPDIR/metro-cache.
      - name: Export production-like JS bundles
        env:
          TMPDIR: ${{ runner.temp }}
        run: CI=1 pnpm export:check
