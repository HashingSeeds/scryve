name: checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint
        run: pnpm lint:check

      - name: Type-check app and tests
        run: pnpm compile

      - name: Validate dependency boundaries
        run: pnpm depcruise

      - name: Run Jest tests
        id: jest
        run: CI=1 pnpm exec jest --ci --silent

      - name: Add Jest result to job summary
        if: always()
        run: |
          echo "Jest result: ${{ steps.jest.outcome }}" >> "$GITHUB_STEP_SUMMARY"
