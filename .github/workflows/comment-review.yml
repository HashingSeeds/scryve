name: comment review

on:
  push:
    branches: [main]
  issue_comment:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    # Parallel runs could create two trackers. queue: max keeps every pending run, not just the newest.
    concurrency:
      group: comment-review-sync
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Queue new why comments and hide settled ones
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git cat-file -e "$BASE_SHA" || exit 0
          gh label create comment-review --force
          node scripts/comment-review.cjs sync "$BASE_SHA" "$HEAD_SHA"

  # Hides a kept entry as soon as its box is checked. sync also hides any this misses.
  keep:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.title == 'Comment review' &&
      (github.event.comment.user.login == 'github-actions[bot]' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hide kept entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
        run: |
          grep -q '^<!-- comment-review:' <<<"$BODY" || exit 0
          grep -qiE '^- \[x\] keep\s*$' <<<"$BODY" || exit 0
          grep -qiE '^- \[x\] drop\s*$' <<<"$BODY" && exit 0
          gh api graphql -f id="$COMMENT_ID" -f query='
            mutation($id: ID!) {
              minimizeComment(input: { subjectId: $id, classifier: RESOLVED }) { clientMutationId }
            }'
