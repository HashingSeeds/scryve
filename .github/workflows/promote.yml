name: promote

# why: promotes without local secrets, from the Actions tab, the GitHub app, or an agent:
# `gh workflow run promote -f promote=true`. Without `promote`, it only reports.
on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the candidate if Sentry is clean
        type: boolean
        default: false
      soak_minutes:
        description: Minutes an update must spend on beta first
        type: string
        default: "60"

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # why: EAS evaluates app.config.ts, which imports expo/config-plugins.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Promote the newest clean beta update
        env:
          APP_VARIANT: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
          PROMOTE: ${{ inputs.promote && '--yes' || '' }}
        run: node scripts/release-train.cjs promote --soak-minutes "$SOAK_MINUTES" $PROMOTE
