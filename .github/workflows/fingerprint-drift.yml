name: fingerprint drift

# Weekly canary: `eas fingerprint:generate` is the source of truth for which
# project files feed a native fingerprint (the .github/workflows/fingerprints.yml
# `paths:` trigger is a hand-maintained subset of that list). Regenerate the
# source inventory and open a PR when it differs from the committed snapshot so
# someone updates the hand-maintained gate.
#
# token-parity: PR fingerprint checks use a Viewer robot that cannot read EAS env
# vars. Fail when that changes any fingerprint, e.g. a native setting such as
# EXPO_PUBLIC_INVITE_ORIGIN set only on EAS instead of in eas.json.

on:
  schedule:
    - cron: "43 4 * * 3"
  push:
    branches: [main]
    paths:
      - "app.json"
      - "app.config.ts"
      - "eas.json"
      - ".github/workflows/fingerprint-drift.yml"
  workflow_dispatch:

concurrency:
  group: fingerprint-drift
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # expo doctor flags eas-cli as a project dependency, so CI installs a global copy pinned by
      # package.json `config.easCli`, the version local scripts run too.
      - name: Install EAS CLI
        run: npm install -g "eas-cli@$(node -p "require('./package.json').config.easCli")"

      - name: List fingerprint sources
        id: sources
        run: |
          set -euo pipefail
          for platform in ios android; do
            eas fingerprint:generate \
              --build-profile development \
              --platform "$platform" \
              --json \
              --non-interactive \
              | jq -er --arg platform "$platform" '
                .sources | map("\($platform)|\(.type)|\(.filePath // .id)") | .[]' \
              >> "$RUNNER_TEMP/sources.txt"
          done
          sort -u "$RUNNER_TEMP/sources.txt" -o "$RUNNER_TEMP/sources.txt"

      - name: Compare to committed snapshot
        id: drift
        env:
          BRANCH_NAME: fingerprint-sources-${{ github.run_id }}
        run: |
          set -euo pipefail
          snapshot="scripts/ci/fingerprint-sources.txt"
          fresh="$RUNNER_TEMP/sources.txt"
          mkdir -p "$(dirname "$snapshot")"
          if [ -f "$snapshot" ] && diff -u "$snapshot" "$fresh"; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff -u "$snapshot" "$fresh" -L committed -L regenerated > "$RUNNER_TEMP/diff.pat" || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$fresh" "$snapshot"
          git add "$snapshot"
          git commit -m "chore(ci): refresh fingerprint source snapshot"
          git checkout -b "$BRANCH_NAME"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -u origin HEAD
          echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Open update PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: fingerprint-sources-${{ github.run_id }}
        run: |
          diff_body=$(head -c 4000 "$RUNNER_TEMP/diff.pat" || true)
          {
            echo "eas fingerprint:generate started (or stopped) considering different project files this week."
            echo
            echo '```diff'
            echo "$diff_body"
            echo '```'
            echo
            echo "Review the diff, then update the \`paths:\` list in \`.github/workflows/fingerprints.yml\` so it still covers every entry \u2014 that trigger is a hand-maintained subset of this list."
            echo
            echo "Model/harness: opencode on GLM (glm-5.3-flash)"
          } > "$RUNNER_TEMP/body.md"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(ci): fingerprint inputs changed" \
            --body-file "$RUNNER_TEMP/body.md"

  token-parity:
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g "eas-cli@$(node -p "require('./package.json').config.easCli")"

      - name: Compare PR-token and release-token fingerprints
        env:
          EXPO_TOKEN_PR: ${{ secrets.EXPO_TOKEN_PR }}
          EXPO_TOKEN_RELEASE: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EXPO_TOKEN_PR:?EXPO_TOKEN_PR is not set}"
          : "${EXPO_TOKEN_RELEASE:?EXPO_TOKEN is not set in the release environment}"

          # Prints the fingerprint hash. eas-cli can log lines before the JSON on stdout.
          fingerprint() {
            local token="$1" profile="$2" platform="$3" log="$4"
            EXPO_TOKEN="$token" eas fingerprint:generate \
              --build-profile "$profile" --platform "$platform" --json --non-interactive \
              2> "$log" \
              | awk 'found{print} !found && /^[{[]/{found=1; print}' \
              | jq -er .hash
          }

          mismatch=false
          for profile in development:device preview:device production; do
            for platform in ios android; do
              log="$RUNNER_TEMP/release.log"
              release=$(fingerprint "$EXPO_TOKEN_RELEASE" "$profile" "$platform" "$log")
              # why: if the release token cannot read EAS env vars either, both sides match
              # trivially and this check proves nothing.
              if grep -q "Failed to pull env variables" "$log"; then
                cat "$log" >&2
                echo "::error::EXPO_TOKEN could not read EAS env vars for $profile/$platform"
                exit 1
              fi
              pr=$(fingerprint "$EXPO_TOKEN_PR" "$profile" "$platform" "$RUNNER_TEMP/pr.log")
              if [ "$pr" = "$release" ]; then
                echo "$profile/$platform: $pr"
              else
                echo "::error::$profile/$platform: PR token gives $pr, release token gives $release. An EAS env var changes native config; move it into eas.json."
                mismatch=true
              fi
            done
          done
          [ "$mismatch" = false ]
