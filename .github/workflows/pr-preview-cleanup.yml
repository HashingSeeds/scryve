name: pr preview cleanup

# why: deletes the pr-<number> EAS channels and branches that pr-preview creates once their PR is
# closed. Every trigger runs the same sweep, so a missed event is caught by the next run. Merged
# PRs auto-delete their branch, so `delete` covers them; the daily sweep catches PRs closed
# without merging. Never add pull_request or pull_request_target: this job can delete EAS
# channels, and those triggers let a PR branch start it.
on:
  delete:
  schedule:
    - cron: "29 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List closed PR channels without deleting them
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-preview-cleanup
  cancel-in-progress: false

jobs:
  sweep:
    # why: its own environment, limited to main and with no reviewer, so sweeps never wait for
    # approval. `delete` and `schedule` always run on the default branch, and the `if` keeps a
    # dispatch from another branch from running that branch's copy of the sweep.
    if: github.ref == 'refs/heads/main'
    environment: pr-preview-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # why: EAS evaluates app.config.ts, which imports expo/config-plugins.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli@22.2.0

      - name: Delete channels whose PR is closed
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # eas-cli can log lines before the JSON on stdout (expo/eas-cli#3870).
          json() { awk 'found{print} !found && /^[{[]/{found=1; print}'; }

          # Prints every PR channel or branch name. Lists all pages before anything is deleted,
          # since deleting shifts the offsets.
          pr_names() {
            local offset=0 page
            while :; do
              page=$(eas "$1:list" --limit 25 --offset "$offset" --json --non-interactive | json \
                | jq -r "$2 | .name") || return 1
              [ -z "$page" ] && return
              # why: the token can delete beta, preview, and production too; touch only PR channels.
              grep -E '^pr-[0-9]+$' <<< "$page" || true
              offset=$((offset + 25))
            done
          }
          channels=$(pr_names channel '.currentPage[]')
          branches=$(pr_names branch '.[]')

          failed=0
          mapfile -t names < <(printf '%s\n' "$channels" "$branches" | grep -E '^pr-[0-9]+$' | sort -u)
          for name in "${names[@]}"; do
            if ! state=$(gh pr view "${name#pr-}" --json state --jq .state); then
              echo "::warning::could not read the state of PR ${name#pr-}; keeping $name"
              continue
            fi
            if [ "$state" = OPEN ]; then
              echo "keep   $name"
              continue
            fi
            echo "$([ "$DRY_RUN" = true ] && echo stale || echo delete) $name ($state)"
            [ "$DRY_RUN" = true ] && continue
            # why: the channel goes first so the branch is no longer linked. Both lists feed the
            # sweep, so a half that fails here is retried by the next run, which still fails loudly.
            if grep -qx "$name" <<< "$channels"; then
              eas channel:delete "$name" --non-interactive || {
                echo "::error::could not delete channel $name"
                failed=1
                continue
              }
            fi
            if grep -qx "$name" <<< "$branches"; then
              eas branch:delete "$name" --non-interactive || {
                echo "::error::could not delete branch $name"
                failed=1
              }
            fi
          done
          exit "$failed"
