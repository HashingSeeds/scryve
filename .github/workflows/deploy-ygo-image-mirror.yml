name: deploy Yu-Gi-Oh image mirror

on:
  workflow_dispatch:

concurrency:
  group: deploy-ygo-image-mirror-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: ygo-image-mirror-production
      url: https://ygo-images.scryve.sow.care/health
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Worker
        run: pnpm check:ygo-worker

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --cwd workers/ygo-image-mirror --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check production health
        run: >-
          curl --silent --show-error --fail-with-body
          --retry 12 --retry-all-errors --retry-delay 5
          https://ygo-images.scryve.sow.care/health
