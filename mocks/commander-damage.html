<title>Commander Damage Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #0b0b0c;
  --board: #000;
  --ink: #fff;
  --dim: rgba(255,255,255,.55);
  --lethal: #ff6b5e;
  --menu: #26262b;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: Rubik, system-ui, sans-serif; min-height: 100vh; display: flex; gap: 24px; align-items: flex-start; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.phone { width: 390px; height: 844px; flex: none; border-radius: 44px; background: var(--board); position: relative; overflow: hidden; outline: 1px solid #222; user-select: none; }
.seat { position: absolute; width: 189px; height: 416px; border-radius: 24px; overflow: hidden; transition: background-color 420ms cubic-bezier(.45,.05,.25,1); }
.up { position: absolute; width: 416px; height: 189px; left: calc((189px - 416px) / 2); top: calc((416px - 189px) / 2); }
.up > * { position: absolute; }
.fadein { animation: fadein 260ms ease both; }
@keyframes fadein { from { opacity: 0 } }

/* idle */
.life { left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-weight: 700; font-size: 112px; line-height: 1; font-variant-numeric: tabular-nums; pointer-events: none; }
.pm { width: 64px; height: 120px; top: calc(50% - 60px); display: grid; place-items: center; }
.pm.minus { left: 0 } .pm.plus { right: 0 }
.ident { left: 12px; bottom: 10px; display: flex; align-items: center; gap: 2px; }
.namebtn { display: flex; align-items: center; gap: 6px; min-height: 40px; padding-right: 6px; font-weight: 700; font-size: 17px; }
.sword { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; position: relative; }
.sword svg { transition: transform 220ms ease, opacity 200ms; }
.sword.open::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); }
.intro .sword svg { animation: unsheathe 900ms cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0ms); }
@keyframes unsheathe { 0% { transform: translateX(calc(var(--from) * -1)) scale(.45); opacity: 0 } 35% { opacity: 1 } 100% { transform: none } }
.bag { right: 18px; bottom: 16px; opacity: .55; pointer-events: none; }
.tokens { right: 54px; bottom: 16px; height: 26px; display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; opacity: .85; pointer-events: none; }
.tok { display: flex; align-items: center; gap: 2px; }
.grid { display: grid; grid-template-columns: 22px 22px; gap: 3px; pointer-events: none; }
.up > .grid { left: 12px; top: 10px; }
.cell { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; transition: opacity 200ms; }
.cell.rim { box-shadow: inset 0 0 0 2px #fff; }
.cell.near, .half.near { background: #fff !important; color: #000; }
.cell.faded { opacity: .28; }
.cell.lit { box-shadow: 0 0 0 2px #fff; }
/* partners: the same circle cut across, one total per commander, first on top */
.cell.duo { grid-template-rows: 1fr 1fr; place-items: stretch; gap: 1px; overflow: hidden; font-size: 9px; line-height: 1; }
.half { position: relative; display: grid; place-items: center; overflow: hidden; }
.half:first-child { padding-top: 2.5px; }
.half:last-child { padding-bottom: 2.5px; }
/* a half's outline is its arc of the whole circle */
.half::after { content: ""; position: absolute; left: 0; width: 22px; height: 22px; border-radius: 50%; }
.half:first-child::after { top: 0; }
.half:last-child::after { bottom: 0; }
.half.rim::after { box-shadow: inset 0 0 0 1.5px #fff; }
.half.zero { color: rgba(255,255,255,.4); }

/* placement variants, in the seat's upright frame; v3 is the base */
.up > .sword { position: absolute; }
[data-v=v1] .up > .sword { right: 9px; bottom: 7px; }
[data-v=v1] .bag { right: 58px; }
[data-v=v1] .tokens { right: 94px; }
[data-v=v2] .up > .sword { left: 9px; top: 7px; }
[data-v=v2] .ownlife { left: 58px; top: 16px; }

/* attacker */
.ownlife { left: 14px; top: 10px; font-weight: 700; font-size: 22px; opacity: .6; }
.powers { left: 0; right: 0; top: 38px; bottom: 50px; display: flex; justify-content: center; align-items: center; gap: 12px; }
.pbox { width: 176px; border-radius: 14px; border: 2.5px solid #fff; background: var(--paper); color: var(--ink); overflow: hidden; }
.prow { height: 64px; display: flex; align-items: stretch; }
.pbtn { flex: 0 0 50px; display: grid; place-items: center; touch-action: none; }
.pbtn:active { background: rgba(0,0,0,.12); }
.pbtn.stop { opacity: .25; }
.pnum { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
.pname { height: 26px; display: grid; place-items: center; background: var(--seat); color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; border-top: 1px solid rgba(0,0,0,.3); }
.pair .pbox { width: 152px; }
.pair .prow { height: 54px; }
.pair .pbtn { flex-basis: 42px; }
.pair .pnum { font-size: 32px; }
.pair .pname { height: 24px; }
.pbox.off { opacity: .5; cursor: pointer; }
.pbox.off .pname { background: none; color: var(--ink); border-top-color: transparent; }

/* defender */
.seat.def .up { cursor: pointer; }
.disc { left: calc(50% - 90px); top: calc(50% - 90px); width: 180px; height: 180px; pointer-events: none; }
.disc > svg { position: absolute; inset: 0; overflow: visible; }
.disc .cap { position: absolute; left: 0; right: 0; top: 20px; text-align: center; font-weight: 700; font-size: 10px; opacity: .55; }
.disc .dlife { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-weight: 700; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
/* the hit a tap deals, outside the disc and pointing at it */
.strike { left: 8px; width: 108px; top: calc(50% - 22px); height: 44px; display: flex; align-items: center; justify-content: flex-end; font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; pointer-events: none; }
.strike.lethal { color: var(--lethal); }
.strike .sw { display: grid; }
.strike .dmg { transition: opacity 160ms; }
/* a sword is in the air for this seat: its landing spot waits for it, then the preview starts to move */
.seat[data-await] .strike .sw { visibility: hidden; }
.seat[data-await] .strike .dmg { opacity: 0; transition: none; }
.seat:not([data-await]) .strike svg { animation: nudge 1.6s ease-in-out infinite; }
.seat:not([data-await]) .seg-prev { animation: breathe 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: rotate(90deg) translateY(-4px) } }
@keyframes breathe { 0%,100% { opacity: .95 } 50% { opacity: .35 } }
.bump { animation: bump 380ms ease; }
@keyframes bump { 30% { transform: scale(1.07) } }
.undo { right: 6px; top: calc(50% - 30px); height: 60px; min-width: 60px; padding: 0 8px; display: flex; align-items: center; gap: 6px; }
.coins { display: flex; }
.coin { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #000; margin-left: -7px; box-shadow: 0 0 0 2px var(--shadowbg, #000); }
.coin:first-child { margin-left: 0; }
.more { font-weight: 700; font-size: 12px; opacity: .7; margin-left: 3px; }
.dname { left: 12px; bottom: 10px; display: flex; align-items: center; gap: 6px; min-height: 40px; font-weight: 700; font-size: 17px; opacity: .85; pointer-events: none; }

/* center */
.menu { position: absolute; left: calc(50% - 32px); top: calc(50% - 32px); width: 64px; height: 64px; display: grid; place-items: center; z-index: 5; }
.menu svg { transition: transform 260ms cubic-bezier(.3,1.4,.5,1); }
.menu.pulse svg { animation: bump 300ms ease; }
.fly { position: absolute; left: 0; top: 0; z-index: 20; pointer-events: none; font-weight: 700; font-size: 26px; white-space: nowrap; }
.fly svg { display: block; }

/* reviewer side panel, outside the phone */
.side { width: 300px; font-size: 13px; color: #aaa; display: flex; flex-direction: column; gap: 12px; }
.side .row { display: flex; gap: 8px; }
.side button { border: 1px solid #333; border-radius: 6px; padding: 6px 10px; color: #ddd; }
.side button:hover { border-color: #666; }
.side button[aria-pressed=true] { border-color: #fff; color: #fff; }
#log { font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.5; color: #bbb; white-space: pre-wrap; max-height: 720px; overflow: auto; }
#log div:first-child { color: #fff; }
@media (max-width: 760px) { .side { display: none } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .seg-prev { opacity: .5; }
}
</style>
<div class="phone" id="phone"></div>
<div class="side">
  <div class="row"><button id="reset">Reset board</button><button id="intro">Replay first open</button></div>
  <div class="row" id="variants">
    <button data-pick="v1" title="Grid, mark and name bottom-left. Sword in the corner, outside the bag.">1 by bag</button>
    <button data-pick="v2" title="Grid, mark and name bottom-left. Sword alone top-left.">2 top left</button>
    <button data-pick="v3" title="Grid top-left. Mark, name and sword bottom-left.">3 by name</button>
  </div>
  <div id="log"></div>
</div>

<script>
const LETHAL = 21
const W = 189, H = 416, PAD = 4, GAP = 4
const SHAPES = {
  heart: '<path fill-rule="evenodd" d="M22 7.5C29.5 12 33.5 18.5 32.8 25.2 32.2 30.6 27.8 33.6 22.9 33.6V36.5A.9.9 0 0 1 21.1 36.5V33.6C16.2 33.6 11.8 30.6 11.2 25.2 10.5 18.5 14.5 12 22 7.5Z"/>',
  triangle: '<path d="M25.4 11.54A3.7 3.7 0 0 1 30.9 15.53 3.7 3.7 0 0 1 33 22 3.7 3.7 0 0 1 30.9 28.47 3.7 3.7 0 0 1 25.4 32.46 3.7 3.7 0 0 1 18.6 32.46 3.7 3.7 0 0 1 13.1 28.47 3.7 3.7 0 0 1 11 22 3.7 3.7 0 0 1 13.1 15.53 3.7 3.7 0 0 1 18.6 11.54 3.7 3.7 0 0 1 25.4 11.54Z"/>',
  banner: '<path d="M10 8.5H34A1.5 1.5 0 0 1 34 11.5H10A1.5 1.5 0 0 1 10 8.5ZM12.5 11H31.5V35.5L22 29.5 12.5 35.5Z"/>',
  quatrefoil: '<path d="M28.6 14.6A6.6 6.6 0 1 1 15.4 14.6 6.6 6.6 0 1 1 28.6 14.6ZM36 22A6.6 6.6 0 1 1 22.8 22 6.6 6.6 0 1 1 36 22ZM28.6 29.4A6.6 6.6 0 1 1 15.4 29.4 6.6 6.6 0 1 1 28.6 29.4ZM21.2 22A6.6 6.6 0 1 1 8 22 6.6 6.6 0 1 1 21.2 22ZM15 15H29V29H15Z"/>',
}
const SWORD = '<path d="M12 2.5 L14.1 6.4 V14.4 H9.9 V6.4 Z"/><rect x="6.8" y="14.6" width="10.4" height="1.9" rx=".9"/><rect x="11.05" y="16.9" width="1.9" height="4.6" rx=".9"/>'
const sword = (size, color = 'currentColor', tilt = 0) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="transform:rotate(${tilt}deg)">${SWORD}</svg>`
const mark = (shape, size, color) => `<svg width="${size}" height="${size}" viewBox="6 6 32 32" fill="${color}">${SHAPES[shape]}</svg>`
const line = (size, plus, color = '#fff', w = 3) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke="${color}" stroke-width="${w * 24 / size}" stroke-linecap="round"><path d="M3 12H21${plus ? 'M12 3V21' : ''}"/></svg>`
const UNDO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'
const BAG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8.2 3.5h7.6l-1.6 3.1c3.7 1.4 6.3 5 6.3 8.9 0 3.8-3.6 5.5-8.5 5.5s-8.5-1.7-8.5-5.5c0-3.9 2.6-7.5 6.3-8.9Z"/></svg>'
const TOKENS = {
  poison: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5C8 8 5.5 11.4 5.5 15a6.5 6.5 0 0 0 13 0c0-3.6-2.5-7-6.5-12.5Z"/></svg>',
  energy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 10h-5.8Z"/></svg>',
}

const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16))
const mix = (a, b, t) => { const [x, y] = [hex(a), hex(b)]; return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',')})` }
const light = (c) => mix(c, '#ffffff', 0.42)
const shade = (c) => mix(c, '#000000', 0.84)

const START = () => ({
  players: [
    { id: 'p1', name: 'Ana', color: '#B85636', shape: 'heart', col: 0, row: 0, rot: 90, life: 19, cmdrs: [{ name: 'Atraxa', power: 4 }] },
    { id: 'p2', name: 'Ben', color: '#41476E', shape: 'triangle', col: 1, row: 0, rot: -90, life: 34, tokens: { poison: 3, energy: 2 }, cmdrs: [{ name: 'Tymna', power: 2 }, { name: 'Thrasios', power: 4 }] },
    { id: 'p3', name: 'Cleo', color: '#39755C', shape: 'banner', col: 0, row: 1, rot: 90, life: 28, tokens: { poison: 3, energy: 2 }, cmdrs: [{ name: 'Edgar Markov', power: 4 }] },
    { id: 'p4', name: 'Dev', color: '#94632D', shape: 'quatrefoil', col: 1, row: 1, rot: -90, life: 24 },
  ],
  dmg: { p4: { p3: [12, 0] }, p1: { p4: [13, 0] }, p2: { p1: [11, 10] } },
  armed: null,
  boxes: {},
  hits: {},
  last: null,
})
let S = START()
const byId = (id) => S.players.find((p) => p.id === id)
// a seat with no deck picked still attacks: one commander, and room for a partner
const NO_DECK = [{ name: 'Commander', power: 1 }, { name: 'Partner', power: 1 }]
const slots = (p) => p.cmdrs ?? NO_DECK
// why: a box is on or off; off boxes wait at their printed power, and the first box starts on.
const boxes = (p) => (S.boxes[p.id] ??= slots(p).map((c, slot) => ({ power: c.power, on: slot === 0 })))
const total = (from, to, slot) => S.dmg[from]?.[to]?.[slot] ?? 0
const taken = (to) => S.players.some((p) => sum(S.dmg[p.id]?.[to] ?? []) > 0)
const steps = () => boxes(byId(S.armed)).map((b) => (b.on ? b.power : 0))
const sum = (xs) => xs.reduce((a, b) => a + b, 0)

/* placement variant: the hash is shareable, the panel and keys 1/2/3 write it */
const VARIANTS = ['v1', 'v2', 'v3']
const hashed = () => VARIANTS.find((v) => v === location.hash.slice(1))
let V = hashed() ?? 'v3'

/* rendering */
const phone = document.getElementById('phone')
const seatEls = {}
S.players.forEach((p) => {
  const el = document.createElement('div')
  el.className = 'seat'
  el.style.left = `${PAD + p.col * (W + GAP)}px`
  el.style.top = `${PAD + p.row * (H + GAP)}px`
  el.innerHTML = `<div class="up" style="transform:rotate(${p.rot}deg)"></div>`
  phone.append(el)
  seatEls[p.id] = el
})
const menu = document.createElement('button')
menu.className = 'menu'
menu.dataset.act = 'menu'
phone.append(menu)

// why: the mini-map mirrors the physical board, turned to face the seat that reads it.
function gridCells(me) {
  const turn = (q) => { const dx = q.col - me.col, dy = q.row - me.row; return me.rot === 90 ? [dy, -dx] : [-dy, dx] }
  const pts = S.players.map((q) => [q, ...turn(q)])
  const mx = Math.min(...pts.map((t) => t[1])), my = Math.min(...pts.map((t) => t[2]))
  return pts.sort((a, b) => (a[2] - my) * 2 + (a[1] - mx) - ((b[2] - my) * 2 + (b[1] - mx))).map((t) => t[0])
}
const tier = (t) => (t >= LETHAL - 5 ? ' near' : t >= Math.ceil(LETHAL / 2) ? ' rim' : '')
function grid(me, attacker) {
  const cells = gridCells(me).map((q) => {
    if (q.id === me.id) return `<div class="cell${attacker ? ' faded' : ''}">${mark(me.shape, 22, '#fff')}</div>`
    const state = attacker ? (q.id === attacker ? ' lit' : ' faded') : ''
    const [first, second] = [0, 1].map((slot) => total(q.id, me.id, slot))
    // why: 21 is lethal per commander, so partners never share a number: the circle is cut across.
    if (q.cmdrs?.[1] || second) return `<div class="cell duo${state}" data-cell="${q.id}">${[first, second].map((t) => `<div class="half${tier(t)}${t ? '' : ' zero'}" style="background:${q.color}">${t}</div>`).join('')}</div>`
    return `<div class="cell${tier(first)}${state}" data-cell="${q.id}" style="background:${q.color}">${first}</div>`
  })
  return `<div class="grid">${cells.join('')}</div>`
}
// why: v3 keeps the damage grid in the top-left corner beside a plain mark; v1 and v2 put it where the mark sits.
function gridOrMark(p, attacker) {
  const g = attacker || taken(p.id) ? grid(p, attacker) : ''
  const m = mark(p.shape, 26, 'rgba(255,255,255,.85)')
  return V === 'v3' ? { corner: g, lead: m } : { corner: '', lead: g || m }
}
// why: v3 seats the sword after the name; v1 and v2 pin it to a corner in CSS.
const byName = () => V === 'v3'
const swordBtn = (p, label, tilt, open) => `<button class="sword${open ? ' open' : ''}" data-act="arm" data-p="${p.id}" aria-label="${label}">${sword(tilt ? 30 : 32, '#fff', tilt)}</button>`
const tokens = (p) => (p.tokens ? `<div class="tokens">${Object.entries(p.tokens).map(([kind, n]) => `<div class="tok" aria-label="${n} ${kind}">${TOKENS[kind]}${n}</div>`).join('')}</div>` : '')

function ring(r, width, filled, preview, lethalAt, color) {
  const n = LETHAL, seg = 360 / n, gap = 2.6
  const pt = (a) => [90 + r * Math.cos((a * Math.PI) / 180), 90 + r * Math.sin((a * Math.PI) / 180)]
  let out = ''
  for (let i = 0; i < n; i++) {
    const a0 = -90 + i * seg + gap / 2, a1 = a0 + seg - gap
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1)
    const on = i < filled, pre = !on && i < filled + preview
    const red = (on || pre) && lethalAt
    const stroke = red ? 'var(--lethal)' : on || pre ? color : 'rgba(255,255,255,.1)'
    out += `<path class="${pre ? 'seg-prev' : ''}" d="M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${stroke}" stroke-width="${width}" fill="none"/>`
  }
  return out
}

function idleSeat(p) {
  const { corner, lead } = gridOrMark(p)
  const open = S.last?.from === p.id
  const btn = swordBtn(p, open ? 'Reopen last attack' : 'Deal commander damage', 0, open)
  return `
    ${corner}
    <button class="pm minus" data-act="life" data-p="${p.id}" data-d="-1" aria-label="Lose 1 life">${line(26, false)}</button>
    <div class="life">${p.life}</div>
    <button class="pm plus" data-act="life" data-p="${p.id}" data-d="1" aria-label="Gain 1 life">${line(26, true)}</button>
    <div class="ident">
      <button class="namebtn" data-act="arm" data-p="${p.id}" aria-label="${p.name}">${lead}${p.name}</button>
      ${byName() ? btn : ''}
    </div>
    ${byName() ? '' : btn}
    ${tokens(p)}
    <div class="bag">${BAG}</div>`
}

function attackerSeat(p) {
  const btn = swordBtn(p, 'Done', 45)
  const bs = boxes(p), pair = bs.length > 1, last = bs.filter((b) => b.on).length === 1
  const ink = shade(p.color), glyph = pair ? 18 : 22
  const cols = slots(p).map((c, slot) => {
    const { power, on } = bs[slot]
    if (!on) return `<div class="pbox off" role="button" data-act="on" data-slot="${slot}" aria-label="Add ${c.name} at ${power}"><div class="prow"><div class="pnum">${power}</div></div><div class="pname">${c.name}</div></div>`
    const drop = power === 1
    return `<div class="pbox">
      <div class="prow">
        <button class="pbtn${drop && last ? ' stop' : ''}" data-act="pow" data-slot="${slot}" data-d="-1" aria-label="${drop ? `Remove ${c.name}` : `${c.name} power down`}">${line(glyph, false, ink)}</button>
        <div class="pnum">${sword(pair ? 20 : 26, ink)}${power}</div>
        <button class="pbtn" data-act="pow" data-slot="${slot}" data-d="1" aria-label="${c.name} power up">${line(glyph, true, ink)}</button>
      </div>
      <div class="pname">${c.name}</div></div>`
  })
  return `
    <div class="ownlife">${p.life}</div>
    <div class="powers${pair ? ' pair' : ''}" style="--paper:${mix(p.color, '#ffffff', .72)};--ink:${ink};--seat:${p.color}">${cols.join('')}</div>
    <div class="ident">
      <div class="namebtn" style="pointer-events:none">${gridOrMark(p).lead}${p.name}</div>
      ${byName() ? btn : ''}
    </div>
    ${byName() ? '' : btn}`
}

function defenderSeat(p) {
  const a = byId(S.armed), tint = light(a.color)
  const st = steps(), dealt = sum(st)
  const totals = st.map((_, slot) => total(a.id, p.id, slot))
  const lethal = totals.some((t, i) => st[i] > 0 && t + st[i] >= LETHAL) || p.life - dealt <= 0
  // why: one ring per commander that is attacking or has already hit this seat; a lone ring takes the full band.
  const live = st.map((_, slot) => slot).filter((slot) => st[slot] > 0 || totals[slot] > 0)
  const two = live.length > 1
  const rings = live.map((slot) => {
    const t = totals[slot]
    return ring(two ? (slot === 0 ? 86 : 78) : 84, two ? 5 : 7, Math.min(t, LETHAL), Math.max(0, Math.min(st[slot], LETHAL - t)), t + st[slot] >= LETHAL && st[slot] > 0 || t >= LETHAL, tint)
  }).join('')
  const hits = S.hits[p.id] ?? []
  const { corner, lead } = gridOrMark(p, a.id)
  const coins = hits.slice(-4).map((h) => `<div class="coin" style="background:${tint}">${sum(h)}</div>`).join('')
  return `
    ${corner}
    <div class="strike${lethal ? ' lethal' : ''}" style="${lethal ? '' : `color:${mix(a.color, '#ffffff', .78)}`}"><span class="dmg">−${dealt}</span><span class="sw">${sword(34, 'currentColor', 90)}</span></div>
    <div class="disc" data-disc>
      <svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="${two ? 72 : 76}" fill="${p.color}"/>${rings}</svg>
      <div class="cap">${LETHAL}</div>
      <div class="dlife">${p.life}</div>
    </div>
    <div class="dname">${lead}${p.name}</div>
    ${hits.length ? `<button class="undo" data-act="undo" data-p="${p.id}" aria-label="Take back ${sum(hits.at(-1))}" style="--shadowbg:${shade(a.color)}">${UNDO}<div class="coins">${coins}</div>${hits.length > 4 ? `<span class="more">+${hits.length - 4}</span>` : ''}</button>` : ''}`
}

const modeOf = (p) => (!S.armed ? 'idle' : S.armed === p.id ? 'attacker' : 'defender')
let lastModes = {}
// where each variant's sword slides out from on first open: the bag, nowhere, the mark
const UNSHEATHE = { v1: () => 49, v2: () => 0, v3: (up) => up.querySelector('.namebtn').offsetWidth }
function render(intro = false) {
  phone.dataset.v = V
  document.querySelectorAll('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.pick === V))
  S.players.forEach((p) => {
    const el = seatEls[p.id], up = el.firstElementChild, mode = modeOf(p)
    el.className = `seat${mode === 'defender' ? ' def' : ''}`
    el.style.backgroundColor = mode === 'defender' ? shade(byId(S.armed).color) : p.color
    up.className = `up${lastModes[p.id] !== mode ? ' fadein' : ''}${intro ? ' intro' : ''}`
    up.dataset.p = p.id
    if (mode === 'defender') up.dataset.act = 'hit'; else delete up.dataset.act
    up.innerHTML = mode === 'idle' ? idleSeat(p) : mode === 'attacker' ? attackerSeat(p) : defenderSeat(p)
    if (intro && mode === 'idle') {
      const b = up.querySelector('.sword')
      b.style.setProperty('--from', `${UNSHEATHE[V](up)}px`)
      b.style.setProperty('--d', `${150 + S.players.indexOf(p) * 90}ms`)
    }
    lastModes[p.id] = mode
  })
  const a = S.armed && byId(S.armed)
  const landed = Object.values(S.hits).some((h) => h.length)
  menu.setAttribute('aria-label', a ? (landed ? 'Done' : 'Cancel') : 'Menu')
  menu.innerHTML = `<svg width="60" height="60" viewBox="0 0 60 60">
    <path d="M30 6 53 22.7 44.2 49.8H15.8L7 22.7Z" fill="${a ? a.color : 'var(--menu)'}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    ${a ? (landed ? '<path d="M20 31l7 7 13-15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>' : '<path d="M22 23l16 16M38 23 22 39" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>')
        : '<path d="M20 25H40M20 32H40M20 39H40" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>'}
  </svg>`
}

/* flight between seats, turning to face each reader as it travels */
const calm = matchMedia('(prefers-reduced-motion: reduce)')
// centre of an element in phone pixels, whatever the page zoom
function spot(el) {
  if (!el) return
  const box = phone.getBoundingClientRect(), r = el.getBoundingClientRect(), k = box.width / 390
  return [(r.left + r.width / 2 - box.left) / k, (r.top + r.height / 2 - box.top) / k]
}
function token(html, color) {
  const t = document.createElement('div')
  t.className = 'fly'
  t.innerHTML = html
  t.style.color = color
  phone.append(t)
  return t
}
const at = ([x, y]) => `translate(${x}px, ${y}px) translate(-50%, -50%)`
// resolves on landing; at once when there is nowhere to fly or motion is reduced
function fly(html, from, to, { color = '#fff', turn, scale = [1.2, .7], ms = 380 }) {
  if (!from || !to || calm.matches) return Promise.resolve()
  const t = token(html, color)
  const pose = (p, i) => `${at(p)} rotate(${turn[i]}deg) scale(${scale[i]})`
  return t.animate([{ opacity: 0, transform: pose(from, 0) }, { opacity: 1, offset: .12 }, { opacity: 1, transform: pose(to, 1) }], { duration: ms, fill: 'both', easing: 'cubic-bezier(.5,0,.3,1)' }).finished.then(() => t.remove())
}

// why: the attacker's sword splits where it rests, one blade per opponent, and each flies straight to the sword beside that seat's disc, so the eye ends on what a tap will hit.
const FAN = 260, FLIGHT = 420, SPLAY = 'cubic-bezier(.2,.9,.3,1.15)'
const bearing = (from, to) => (Math.atan2(to[0] - from[0], from[1] - to[1]) * 180) / Math.PI
// the same angle as `to`, written the short way round from `from`
const toward = (from, to) => from + ((((to - from) % 360) + 540) % 360) - 180
let flight = 0
const grounded = () => { flight++; phone.querySelectorAll('.fly').forEach((t) => t.remove()); S.players.forEach((q) => delete seatEls[q.id].dataset.await) }
function draw(a) {
  if (calm.matches) return
  const run = ++flight
  const rest = seatEls[a.id].querySelector('.sword svg'), home = spot(rest)
  const inward = bearing(home, [195, 422])
  const blades = S.players.filter((q) => q.id !== a.id).map((q) => {
    const landing = seatEls[q.id].querySelector('.strike .sw'), to = spot(landing)
    return { q, landing, to, reach: Math.hypot(to[0] - home[0], to[1] - home[1]), aim: toward(inward, bearing(home, to)) }
  }).sort((x, y) => x.aim - y.aim)
  // each blade leans at its own opponent, but neighbours open at least 40 degrees so the fan reads as one blade each
  blades.forEach((b, i) => (b.lean = i ? Math.max(b.aim, blades[i - 1].lean + 40) : b.aim))
  const drift = sum(blades.map((b) => b.lean - b.aim)) / blades.length
  blades.forEach(({ q, landing, to, reach, aim, lean }) => {
    const seat = seatEls[q.id], tilt = toward(a.rot, lean - drift), rad = (tilt * Math.PI) / 180, ahead = toward(tilt, aim)
    const out = [home[0] + 26 * Math.sin(rad), home[1] - 26 * Math.cos(rad)]
    const go = FAN + 60 + reach * .25, end = go + FLIGHT, timing = { duration: end, fill: 'both' }
    const face = (deg, scale = 1) => `rotate(${deg}deg) scale(${scale})`
    seat.dataset.await = ''
    const t = token(sword(32), getComputedStyle(landing).color)
    // blade first for the first half of the trip, then round to point at the disc
    t.firstElementChild.animate([
      { transform: face(a.rot), easing: SPLAY },
      { transform: face(tilt), offset: FAN / end },
      { transform: face(tilt), offset: go / end },
      { transform: face(ahead), offset: (go + FLIGHT / 2) / end, easing: 'ease-out' },
      { transform: face(toward(ahead, q.rot + 90), 34 / 32) },
    ], timing)
    t.animate([
      { transform: at(home), easing: SPLAY },
      { transform: at(out), offset: FAN / end },
      { transform: at(out), offset: go / end, easing: 'cubic-bezier(.5,0,.3,1)' },
      { transform: at(to) },
    ], timing).finished.then(() => { t.remove(); if (run === flight) delete seat.dataset.await })
  })
  // the resting sword is the blades until they part
  rest.animate([{ opacity: 0 }, { opacity: 0, offset: .6 }, { opacity: 1 }], { duration: FAN + 180 })
}

/* log for reviewers, outside the phone */
const logEl = document.getElementById('log')
const log = (msg) => { const d = document.createElement('div'); d.textContent = msg; logEl.prepend(d) }

/* actions, mirroring reduceAttack */
function apply(from, to, deltas) {
  const row = ((S.dmg[from] ??= {})[to] ??= [0, 0])
  deltas.forEach((d, i) => (row[i] = Math.max(0, row[i] + d)))
  byId(to).life -= sum(deltas)
}
function arm(id) {
  const p = byId(id)
  if (S.armed === id) return done()
  if (S.armed) done(true)
  const reopen = S.last?.from === id
  S.armed = id
  S.hits = reopen ? S.last.hits : {}
  S.last = null
  render()
  draw(p)
  log(reopen ? `${p.name} reopens the last attack: every hit still takes back` : `${p.name} attacks: every other seat now previews the hit`)
}
function done(quiet) {
  const a = byId(S.armed)
  const hit = Object.entries(S.hits).filter(([, h]) => h.length)
  S.last = hit.length ? { from: a.id, hits: S.hits } : null
  grounded()
  hit.forEach(([to, h]) => {
    const seat = seatEls[to], rot = byId(to).rot
    fly(String(sum(h.map(sum))), spot(seat.querySelector('.coins')), spot(seat.querySelector(`[data-cell="${a.id}"]`)), { color: light(a.color), turn: [rot, rot], ms: 320 })
  })
  S.armed = null
  S.hits = {}
  render()
  if (!quiet) log(`${a.name} done${hit.length ? '; tap the ringed sword to reopen until the board changes' : ''}`)
}
function hit(to) {
  const a = byId(S.armed), d = byId(to), st = steps()
  apply(a.id, to, st)
  ;(S.hits[to] ??= []).push(st)
  render()
  const seat = seatEls[to]
  seat.querySelector('[data-disc]').classList.add('bump')
  // the sword beside the disc drives in
  if (!calm.matches) seat.querySelector('.strike svg').animate([{ transform: 'rotate(90deg)' }, { transform: 'rotate(90deg) translateY(-20px)', offset: .35 }, { transform: 'rotate(90deg)' }], { duration: 260, easing: 'ease-out' })
  log(`${a.name} hits ${d.name} for ${sum(st)}: life ${d.life + sum(st)} → ${d.life}, ${slots(a).map((c, i) => st[i] ? `${c.name} ${total(a.id, to, i) - st[i]} → ${total(a.id, to, i)}` : '').filter(Boolean).join(', ')}`)
}
function undo(to) {
  const a = byId(S.armed), d = byId(to), st = S.hits[to].pop()
  apply(a.id, to, st.map((x) => -x))
  fly(`+${sum(st)}`, spot(seatEls[to].querySelector('.coin:last-child') ?? seatEls[to].querySelector('.undo')), spot(seatEls[a.id].querySelector('.pbox:not(.off) .pnum')), { color: light(a.color), turn: [d.rot, a.rot], ms: 320 })
  render()
  log(`take back ${sum(st)} from ${d.name}: life → ${d.life}`)
}
function enable(slot) {
  const a = byId(S.armed), box = boxes(a)[slot]
  box.on = true
  render()
  log(`${slots(a)[slot].name} joins the attack at ${box.power}`)
}
function pow(slot, delta, held) {
  const a = byId(S.armed), bs = boxes(a), box = bs[slot], next = box.power + delta
  if (!box.on || next > 99) return
  if (next >= 1) box.power = next
  // why: − at 1 turns the box off, but a held − stops at 1 and the last box on stays on.
  else if (held || bs.filter((b) => b.on).length === 1) return
  else {
    Object.assign(box, { on: false, power: slots(a)[slot].power })
    log(`${slots(a)[slot].name} leaves the attack`)
  }
  render()
}

let repeat
const stopRepeat = () => { clearTimeout(repeat); clearInterval(repeat) }
// why: power boxes act on press, so the click that follows a box turning on or off cannot land on what replaced it.
phone.addEventListener('pointerdown', (e) => {
  const off = e.target.closest('[data-act="on"]')
  if (off) return enable(+off.dataset.slot)
  const b = e.target.closest('[data-act="pow"]')
  if (!b) return
  const go = (held) => pow(+b.dataset.slot, +b.dataset.d, held)
  go(false)
  repeat = setTimeout(() => (repeat = setInterval(() => go(true), 80)), 380)
})
addEventListener('pointerup', stopRepeat)
addEventListener('pointercancel', stopRepeat)
phone.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]')
  if (!t) return
  const act = t.dataset.act, id = t.dataset.p
  if (act === 'arm') arm(id)
  else if (act === 'hit') hit(id)
  else if (act === 'undo') undo(id)
  else if (act === 'menu') {
    if (S.armed) done()
    else { menu.classList.remove('pulse'); void menu.offsetWidth; menu.classList.add('pulse') }
  } else if (act === 'life') {
    byId(id).life += +t.dataset.d
    if (S.last) log('board changed: last attack is now only in the Log')
    S.last = null
    render()
  }
})

function show(v) {
  if (!v || v === V) return
  V = v
  location.hash = v
  render()
}
document.getElementById('variants').onclick = (e) => show(e.target.dataset.pick)
addEventListener('keydown', (e) => show(VARIANTS[e.key - 1]))
addEventListener('hashchange', () => show(hashed()))

document.getElementById('reset').onclick = () => { grounded(); S = START(); lastModes = {}; logEl.textContent = ''; render(true) }
document.getElementById('intro').onclick = () => render(true)
const fit = () => { phone.style.zoom = Math.min(1, (innerWidth - 32) / 390) }
addEventListener('resize', fit)
fit()
render(true)
log('First Commander board: every sword slides out once')
</script>
