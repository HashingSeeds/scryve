project:
    id: 0deb1097-36db-4e74-a32f-70d5e1532dfb
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    profiles:
        development:
            ios:
                app_id: ffe02298-5176-46ee-a0fc-8d4b815f1cd1
                env:
                    APP_VARIANT: development
                setup_commands:
                    - pnpm install
                    - npx expo prebuild --platform ios --no-install
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build
                output_path: ios/build/Build/Products/Debug-iphonesimulator/*.app
            android:
                env:
                    APP_VARIANT: development
                setup_commands:
                    - pnpm install
                    - npx expo prebuild --platform android --no-install
                build_commands:
                    - cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
                output_path: android/app/build/outputs/apk/debug/app-debug.apk
        # why: dev-client.yml already built this dev client. A recipe only unpacks it, since Revyl
        # tags a build as an Expo dev client only when a recipe produced it, not on `build upload`.
        ci:
            ios:
                app_id: ffe02298-5176-46ee-a0fc-8d4b815f1cd1
                env:
                    APP_VARIANT: development
                build_commands:
                    - rm -rf build/revyl && mkdir -p build/revyl && tar -xzf build/ios-sim.tar.gz -C build/revyl
                output_path: build/revyl/*.app
